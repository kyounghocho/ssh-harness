[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-har-ness"
version = "0.1.0"
description = "SSH Harness - Thin SSH control tool for LLM agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "kyounghocho", email = "kyounghocho@example.com"},
]
keywords = ["ssh", "llm", "agent", "automation", "remote"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "paramiko>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/kyounghocho/ssh-har-ness"
Repository = "https://github.com/kyounghocho/ssh-har-ness.git"
Issues = "https://github.com/kyounghocho/ssh-har-ness/issues"
Documentation = "https://github.com/kyounghocho/ssh-har-ness#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=ssh_harness --cov-report=term-missing"
